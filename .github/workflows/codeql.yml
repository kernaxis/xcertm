name: CodeQL
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
  schedule:
  - cron: 31 5 * * 1
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        languages: go
        build-mode: manual
    - name: Build for CodeQL analysis
      run: go build -mod=readonly ./...
    - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
