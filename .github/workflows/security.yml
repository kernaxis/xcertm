name: Security
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
  schedule:
  - cron: 17 5 * * *
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: govulncheck (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.release && '["amd64","386","arm","arm64"]' || '["amd64"]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Check reachable vulnerabilities
      uses: kernaxis/ci-actions/govulncheck@4c73aaf504f009b51ae37c1b46e948b448e957eb # v0.1.0
      env:
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GOARM: '7'
        CGO_ENABLED: '0'
        GOFLAGS: -mod=readonly
  workflow-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Lint and audit workflows
      uses: kernaxis/ci-actions/workflow-lint@4c73aaf504f009b51ae37c1b46e948b448e957eb # v0.1.0
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
